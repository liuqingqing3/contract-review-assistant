<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合同审查助手 · 本地密钥配置</title><style>body{font:16px/1.8 system-ui;color:#203431;background:#f4f6f3;margin:40px auto;padding:20px;max-width:620px}section{background:white;padding:28px;border:1px solid #d9e2dd;border-radius:12px}input{box-sizing:border-box;width:100%;font:inherit;padding:10px;margin:10px 0}button{font:inherit;padding:9px 16px;background:#166451;color:white;border:0;border-radius:6px}p{color:#667772}a{color:#166451}</style></head><body><section><h1>本地密钥配置</h1><p>仅在你自己的电脑上填写。密钥只保存在当前后台进程的内存中，不写入网页或文件；停止服务后需要重新填写。</p><p>保存不会调用模型，也不会扣费。只有在审查页点击“开始 AI 审查”并同意发送材料后才会调用。</p><form id="form"><label for="key">DeepSeek API 密钥</label><input id="key" type="password" autocomplete="off" spellcheck="false" required placeholder="粘贴你自己创建的密钥"><button id="save">保存到本次运行</button></form><p id="status" role="status"></p><a href="/">返回合同审查助手</a></section><!--LOCAL_CONFIG--><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('key'),status=document.getElementById('status'),save=document.getElementById('save');if(!window.CONTRACT_LOCAL){status.textContent='请通过本地服务打开此页，不要直接双击文件。';return}save.disabled=true;try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Contract-Token':window.CONTRACT_LOCAL.token},body:JSON.stringify({key:key.value})});const d=await r.json();if(!r.ok)throw Error(d.error);key.value='';status.textContent='已保存到本次运行；尚未验证余额或发起付费调用。';}catch(e){status.textContent=e.message}finally{save.disabled=false}};</script></body></html>
